<!DOCTYPE html>
<html>
<head>
    <title>Cloud Moving</title>
</head>

<body style="margin: 0;">
    <div style="width:100%; height:60vh; background-color:#4bb4ed;">  
        <marquee direction="right" scrollamount="20" loop="infinite" style="height:100%; display:flex; ">
            <img src="cloudsnew.png" width="150">
            <img src="cloudsnew.png" width="200">
            <img src="cloudsnew.png" width="190">
            <img src="cloudsnew.png" width="250">
            <img src="cloudsnew.png" width="100">
            <img src="cloudsnew.png" width="300">
        </marquee>
    </div>
    
    <div style="position: relative; width: 100%;">
        <img src="road.png" width="100%" style="display: block;">
        
        <marquee direction="left" scrollamount="15" loop="infinite" style="position: absolute; bottom: 25%; left: 0; width: 100%;">
            <img src="dog1.png" height="120" style="transform: scaleX(-1);">
        </marquee>
    </div>
</body>
</html>
